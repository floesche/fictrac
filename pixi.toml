[workspace]
name = "fictrac"
description = "Webcam-based fictive path integration for tethered insects"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
# C++ toolchain (resolves to gcc/g++ on Linux, AppleClang on macOS, MSVC on Windows)
cxx-compiler     = "*"
cmake            = ">=3.21"
# FicTrac C++ library deps
nlopt            = "*"   # provides NLoptConfig.cmake → NLopt::nlopt
libboost-devel   = "*"   # header-only Boost.Asio + BoostConfig.cmake
libopencv        = "*"   # provides OpenCVConfig.cmake; pulls ffmpeg transitively

[tasks]
# All builds share ./build. Each `configure-*` task sets every camera-SDK
# flag explicitly so that switching SDKs overrides the cached value from a
# previous configure.

# Default build (OpenCV camera input only)
configure = "cmake -S . -B build -DSPINNAKER=OFF -DFLYCAPTURE=OFF -DPYLON=OFF"
build     = { cmd = "cmake --build build --config Release --parallel", depends-on = ["configure"] }

# FLIR Spinnaker SDK build (auto-detects /opt/spinnaker etc.)
configure-spinnaker = "cmake -S . -B build -DSPINNAKER=ON  -DFLYCAPTURE=OFF -DPYLON=OFF"
build-spinnaker     = { cmd = "cmake --build build --config Release --parallel", depends-on = ["configure-spinnaker"] }

# FLIR FlyCapture SDK build (legacy USB2 PGR cameras; needs -DPGR_DIR=...)
configure-flycapture = "cmake -S . -B build -DSPINNAKER=OFF -DFLYCAPTURE=ON  -DPYLON=OFF"
build-flycapture     = { cmd = "cmake --build build --config Release --parallel", depends-on = ["configure-flycapture"] }

# Basler Pylon SDK build (auto-detects /opt/pylon etc.; override with
# -DPylon_ROOT= or the legacy -DBASLER_DIR=...)
configure-pylon = "cmake -S . -B build -DSPINNAKER=OFF -DFLYCAPTURE=OFF -DPYLON=ON"
build-pylon     = { cmd = "cmake --build build --config Release --parallel", depends-on = ["configure-pylon"] }

clean = "cmake -E rm -rf build"

# The conda cxx-compiler package hard-codes CMAKE_GENERATOR to a specific VS
# version that may not be installed. Clearing it at task level lets cmake call
# vswhere internally and pick the newest VS on the machine automatically.
[target.win-64.tasks]
configure          = { cmd = "cmake -S . -B build -DSPINNAKER=OFF -DFLYCAPTURE=OFF -DPYLON=OFF", env = { CMAKE_GENERATOR = "", CMAKE_GENERATOR_TOOLSET = "" } }
configure-spinnaker  = { cmd = "cmake -S . -B build -DSPINNAKER=ON  -DFLYCAPTURE=OFF -DPYLON=OFF", env = { CMAKE_GENERATOR = "", CMAKE_GENERATOR_TOOLSET = "" } }
configure-flycapture = { cmd = "cmake -S . -B build -DSPINNAKER=OFF -DFLYCAPTURE=ON  -DPYLON=OFF", env = { CMAKE_GENERATOR = "", CMAKE_GENERATOR_TOOLSET = "" } }
configure-pylon      = { cmd = "cmake -S . -B build -DSPINNAKER=OFF -DFLYCAPTURE=OFF -DPYLON=ON",  env = { CMAKE_GENERATOR = "", CMAKE_GENERATOR_TOOLSET = "" } }
build              = { cmd = "cmake --build build --config Release --parallel", depends-on = ["configure"] }
build-spinnaker    = { cmd = "cmake --build build --config Release --parallel", depends-on = ["configure-spinnaker"] }
build-flycapture   = { cmd = "cmake --build build --config Release --parallel", depends-on = ["configure-flycapture"] }
build-pylon        = { cmd = "cmake --build build --config Release --parallel", depends-on = ["configure-pylon"] }
