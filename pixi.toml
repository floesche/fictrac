[workspace]
name = "fictrac-scripts"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[tasks]
plot = "python scripts/plot_path.py"
record = "bin/fictrac sample/pbs.txt"

[dependencies]
python = ">=3.11"
pandas = ">=2.0"
matplotlib = ">=3.8"
numpy = ">=1.26"
click = ">=8.1"
